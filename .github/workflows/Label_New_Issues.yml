name: Label issues
on:
  issues:
    types:
      - reopened
      - opened

jobs:
  label-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add enhancement label
        run: gh issue edit "$NUMBER" --add-label "$LABELS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository}}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: enhancement